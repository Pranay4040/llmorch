# llmorch provider + model manifest
#
# These are operational facts about *this machine and account*, not code —
# which is why they live in YAML. Per-machine overrides go in models.local.yaml
# (gitignored), which is deep-merged over this file at load time.
#
# Groq's entries were verified against the live API by `llmorch doctor --live`
# and corrected: two of the three original wire names did not exist on this
# account, and none of the three published limits matched. Gemini's entry is
# still unverified — no GEMINI_API_KEY yet.

version: 1

# ===========================================================================
# Providers
# ===========================================================================

providers:

  # -------------------------------------------------------------------------
  # Groq — the request workhorse.
  # Every value below was read from live response headers, not documentation.
  #
  # The daily cap is 1,000 per model, not the 14,400 originally assumed, and
  # Groq enforces it as a LEAKY BUCKET rather than a midnight reset: the
  # x-ratelimit-reset-requests header comes back at 86400/limit seconds per
  # request spent (86.4s each at 1,000/day, confirmed across three models).
  # Capacity therefore trickles back all day instead of arriving at once.
  #
  # Limits differ per model on this account — compound is 250/day and allam
  # 7,000/day — so only models sharing the 1,000 / 8,000 pair are enabled
  # here. Adding the others needs per-model limit overrides, which the manifest
  # does not yet support (see PROJECT.md).
  # -------------------------------------------------------------------------
  groq:
    enabled: true
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    reset_tz: UTC
    paid: false
    limits:
      # Org-scoped: extra API keys do not raise this. Still the documented
      # figure — the headers expose no per-minute request ceiling to check it
      # against, so it stays as the conservative assumption.
      - {kind: rpm, scope: account, value: 30}
      # Verified per-model: x-ratelimit-limit-tokens = 8000 on every enabled
      # model, and each model reports its own remaining count.
      - {kind: tpm, scope: model, value: 8000}
      # Verified per-model: x-ratelimit-limit-requests = 1000.
      - {kind: rpd, scope: model, value: 1000, reserve: 50}

  # -------------------------------------------------------------------------
  # Gemini — the long-context specialist.
  # 1M context and a generous per-minute token budget, but only 250 requests
  # per day, making each request precious. Resets at PACIFIC midnight, not UTC.
  # -------------------------------------------------------------------------
  gemini:
    enabled: true
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    reset_tz: America/Los_Angeles
    paid: false
    limits:
      - {kind: rpm, scope: model, value: 10}
      - {kind: tpm, scope: model, value: 250000}
      # reserve keeps 30 requests back for critical-path retries.
      - {kind: rpd, scope: model, value: 250, reserve: 30}

  # -------------------------------------------------------------------------
  # NVIDIA NIM — M3.5. Documented but inactive.
  # One key reaches 100+ models labelled by their real vendor, which is the
  # best fit for genuine multi-company diversity. But NVIDIA publishes no
  # official free-tier numbers, so these values are a conservative guess that
  # the governor widens or tightens from observed headers and 429s.
  # -------------------------------------------------------------------------
  nvidia_nim:
    enabled: false
    kind: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_NIM_API_KEY
    reset_tz: UTC
    paid: false
    limits_are_estimated: true
    limits:
      - {kind: rpm, scope: account, value: 10}
      - {kind: rpd, scope: account, value: 100, reserve: 10}

  # -------------------------------------------------------------------------
  # Mistral — M3.5. Documented but inactive.
  # Huge monthly token volume but only ~1-2 requests/minute, so it can never
  # carry latency-sensitive work. Free tier also trains on submitted prompts.
  # -------------------------------------------------------------------------
  mistral:
    enabled: false
    kind: openai_compat
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    reset_tz: UTC
    paid: false
    trains_on_prompts: true
    limits_are_estimated: true
    limits:
      - {kind: rpm, scope: account, value: 1}
      - {kind: rpd, scope: account, value: 200, reserve: 10}

  # -------------------------------------------------------------------------
  # Perplexity — M5. PAID, and inactive by default.
  # Priced per *request* ($5-14 per 1,000) on top of per-token cost, so the
  # per-request fee dominates for short calls. Requires --allow-paid AND a
  # non-zero budget before a single call is made.
  # -------------------------------------------------------------------------
  perplexity:
    enabled: false
    kind: openai_compat
    base_url: https://api.perplexity.ai
    api_key_env: PERPLEXITY_API_KEY
    reset_tz: UTC
    paid: true
    cost:
      input_per_mtok: 1.0
      output_per_mtok: 1.0
      per_request: 0.009
    limits:
      - {kind: requests_per_run, scope: account, value: 2}

# ===========================================================================
# Models
#
# role_affinity is the hand-written capability sheet the dispatcher reads.
# Values are priors, refined over time by the learned track record in
# profiles.json.
# ===========================================================================

models:

  # --- Groq ----------------------------------------------------------------

  # max_output stays at 4096 against a verified 8,000 TPM ceiling, which caps a
  # single request at ~7,200 tokens and leaves ~3,100 for the prompt. Groq
  # nodes must still stay small, which is why the interface contract travels as
  # a compact summary rather than being pasted wholesale.
  #
  # Note for whoever wires the prompts: gpt-oss spends reasoning tokens before
  # emitting anything. A probe with max_tokens=16 returned an EMPTY string and
  # 14 reasoning tokens — the budget went entirely on thinking. These models
  # need generous headroom or they return nothing at all.
  - id: groq/gpt-oss-120b
    provider: groq
    wire_name: openai/gpt-oss-120b
    context: 131072
    max_output: 4096
    quality_prior: 0.74
    supports_json_schema: true
    role_affinity:
      planning: 0.65
      research: 0.30
      backend: 0.68
      frontend: 0.58
      styling: 0.50
      content: 0.60
      review: 0.70
      integration: 0.62

  # The smaller sibling. Kept because a chain rung at the same vendor is still
  # worth having once the cross-vendor rung is exhausted, and because it is
  # measurably faster (429ms vs 595ms on the probe).
  - id: groq/gpt-oss-20b
    provider: groq
    wire_name: openai/gpt-oss-20b
    context: 131072
    max_output: 4096
    quality_prior: 0.62
    supports_json_schema: true
    role_affinity:
      planning: 0.50
      research: 0.25
      backend: 0.58
      frontend: 0.52
      styling: 0.48
      content: 0.52
      review: 0.58
      integration: 0.52

  # Replaces qwen3-32b, which does not exist on this account. Alibaba's model,
  # and the only non-OpenAI general model Groq still serves here — so it is
  # what keeps the Groq half of the roster from being one vendor.
  #
  # WARNING for M4: this one emits <think>...</think> blocks inline in the
  # message content rather than in a reasoning field. The probe replied with a
  # literal <think> block opening the message. Salvage must strip those before
  # an artifact is written, or every file it produces opens with a monologue.
  - id: groq/qwen3.6-27b
    provider: groq
    wire_name: qwen/qwen3.6-27b
    context: 131072
    max_output: 4096
    quality_prior: 0.68
    supports_json_schema: true
    role_affinity:
      planning: 0.45
      research: 0.20
      backend: 0.65
      frontend: 0.62
      styling: 0.60
      content: 0.45
      review: 0.60
      integration: 0.55

  # --- Gemini --------------------------------------------------------------

  - id: gemini/2.5-flash
    provider: gemini
    wire_name: gemini-2.5-flash
    context: 1048576
    max_output: 65536
    quality_prior: 0.80
    supports_json_schema: true
    role_affinity:
      planning: 0.85      # the natural decomposer: huge context
      research: 0.90      # search grounding
      backend: 0.70
      frontend: 0.72
      styling: 0.65
      content: 0.80
      review: 0.70
      integration: 0.75

# ===========================================================================
# Role fallback chains
#
# Order is preference order. Validated at load: every chain must span at least
# two distinct vendors, because failure modes correlate within a vendor — a
# third attempt at the same vendor tends to fail exactly as the first two did.
# ===========================================================================

roles:
  planning:    [gemini/2.5-flash, groq/gpt-oss-120b, groq/gpt-oss-20b]
  research:    [gemini/2.5-flash, groq/gpt-oss-120b]
  backend:     [groq/gpt-oss-120b, gemini/2.5-flash, groq/qwen3.6-27b]
  frontend:    [gemini/2.5-flash, groq/qwen3.6-27b, groq/gpt-oss-120b]
  styling:     [groq/qwen3.6-27b, gemini/2.5-flash]
  content:     [gemini/2.5-flash, groq/gpt-oss-120b]
  review:      [groq/gpt-oss-120b, gemini/2.5-flash, groq/qwen3.6-27b]
  integration: [gemini/2.5-flash, groq/gpt-oss-120b, groq/qwen3.6-27b]

# ===========================================================================
# Defaults
# ===========================================================================

defaults:
  # Fraction of a provider's TPM that any single request may occupy. Requests
  # above this are UNSERVABLE on that model — waiting can never make them fit.
  max_request_tokens_ratio: 0.9

  # Reviews go to whichever chain rung is cheapest in daily requests, which in
  # practice means Groq (14,400/day) rather than Gemini (250/day).
  review_prefers_provider: groq
