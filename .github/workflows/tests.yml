# The test suite stands in for the live APIs.
#
# Nothing in this repository can be checked against Groq or Gemini for free, so
# every invariant learned from a live 429 is now held in place by a test and
# nothing else. That makes "the tests ran" a claim worth automating rather than
# remembering — and worth making on Windows, where three of the invariants in
# HANDOFF.md were faults that only appear on Windows and were caught by hand.
#
# No network is needed: the suite is offline by construction and the demo run
# below uses the mock provider.

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      # One platform's failure is information about that platform, so let the
      # others finish and report rather than cancelling them.
      fail-fast: false
      matrix:
        include:
          # The floor and the ceiling of the supported range, plus Windows —
          # the platform whose faults this project keeps discovering the hard
          # way — plus macOS, because the README tells people to install there
          # and nothing was checking that it worked.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # TEMPORARY. Every smoke test fails on macOS with the started process
      # alive, silent, and never listening, and the obvious causes are ruled out
      # by reading. This reproduces the pattern step by step so the runner can
      # say which step differs. Remove once the answer is known.
      - name: Diagnose smoke boot
        run: python tools/diagnose_smoke_boot.py

      - name: Tests
        run: python -m pytest -q

      # The suite tests the parts. This runs the whole thing: plan, execute
      # against the mock provider, materialize a folder, check the contract, and
      # then start what it wrote and drive it over HTTP. Offline, and it exits
      # non-zero if the assembled project does not serve.
      - name: Demo run, end to end
        env:
          LLMORCH_RUNS_DIR: ${{ runner.temp }}/llmorch-runs
        run: python -m llmorch run --smoke "build a notes app"

      # setup.ps1 cannot be run on the machine it is written on, and it is the
      # first thing a Windows user touches — so this job is where it is proved.
      # It builds its own virtualenv, installs into it, edits the user PATH and
      # writes a Desktop shortcut, and every one of those is checked below.
      - name: Windows setup script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\setup.ps1
          if (-not (Test-Path .\.venv\Scripts\llmorch.exe)) {
            throw "setup.ps1 did not install the llmorch command"
          }
          & .\.venv\Scripts\llmorch.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed llmorch does not run" }
          $link = Join-Path ([Environment]::GetFolderPath('Desktop')) 'llmorch.lnk'
          if (-not (Test-Path $link)) { throw "setup.ps1 did not create the shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($target.Arguments -notlike '*-m llmorch*') {
            throw "the shortcut does not start llmorch"
          }
          Write-Host "setup.ps1 installed, pathed and shortcut llmorch"
