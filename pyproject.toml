[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmorch"
version = "0.1.0"
description = "Quota-governed multi-provider LLM orchestrator"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.7",
    # Windows ships no timezone database; zoneinfo needs this for Gemini's
    # Pacific-midnight quota reset. Not optional on this platform.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Real providers arrive at Milestone 2. Milestone 1 runs on the mock only.
providers = [
    "openai>=1.40",
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
llmorch = "llmorch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
